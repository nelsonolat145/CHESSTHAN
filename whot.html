
<!DOCTYPE html><html><head>
<script>
function safeCredits(val, fallback){
  if(fallback===undefined) fallback=500;
  if(val===undefined||val===null) return fallback;
  let s=String(val).trim().toLowerCase();
  if(s==='undefined'||s==='nan'||s==='' ) return fallback;
  let n=parseInt(val);
  if(isNaN(n)) return fallback;
  return n;
}
let ETHAN_CREDITS = safeCredits(localStorage.getItem('ethan_credits'),500);
function getCredits(){ return safeCredits(localStorage.getItem('ethan_credits'),500); }
function setCredits(newVal){
  newVal=safeCredits(newVal,0);
  localStorage.setItem('ethan_credits', String(newVal));
  try{
    let el=document.getElementById('creditBal'); if(el) el.innerText=newVal;
    let el2=document.getElementById('walletBal'); if(el2) el2.innerText=newVal;
    let el3=document.getElementById('credits'); if(el3) el3.innerText=newVal;
  }catch(e){}
  // Firestore sync if logged in
  try{
    if(window._fb && window._currentUser && window._fb.doc){
      window._fb.setDoc(window._fb.doc(window._fb.db,'chessbyethan_users',window._currentUser.uid),{credits:newVal},{merge:true});
    }
  }catch(e){}
  return newVal;
}
function deductCredits(amount){
  amount=safeCredits(amount,0);
  let cur=getCredits();
  if(cur<amount){ alert('Not enough credits! You have '+cur+' need '+amount); return false; }
  setCredits(cur-amount);
  return true;
}
function addCredits(amount){
  amount=safeCredits(amount,0);
  let cur=getCredits();
  setCredits(cur+amount);
  return cur+amount;
}

</script>

<script>
const PAYSTACK_KEY='pk_live_ec06b408bfb5c633263ee48346288df5df12df7f';
let credits=getCredits(); let stake=100, pot=200, roomCode=null, unsub=null;
let deck=[], my=[], opp=[], center=null, turn=1, pickAccum=0, shapes=['circle','triangle','cross','square','star']; // 1=Golden you, 0=Black opp
function makeDeck(){let d=[]; let nums=[1,2,3,4,5,7,8,10,11,14]; shapes.forEach(s=>{nums.forEach(n=>{d.push({shape:s,number:n});});}); for(let i=0;i<5;i++) d.push({shape:'whot',number:20}); return shuffle(d);}
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a;}
function updateUI(){
 document.getElementById('credits').innerText=getCredits(); credits=getCredits(); document.getElementById('pot').innerText=pot;
 document.getElementById('oppCount').innerText=opp.length; document.getElementById('marketCount').innerText=deck.length;
 document.getElementById('turnBadge').innerText=(turn===1?'Golden':'Black')+' Turn '+(pickAccum?`Pick ${pickAccum}`:'');
 // center
 let cc=document.getElementById('centerCard'); cc.innerHTML=`<div><div style="font-size:28px">${icon(center.shape)}</div><div>${center.number}${center.shape==='whot'?' WHOT':''}</div><div style="font-size:10px">${center.shape}</div></div>`;
 // hands
 let mh=document.getElementById('myHand'); mh.innerHTML=''; my.forEach((c,i)=>{let div=document.createElement('div'); div.className='c'; div.innerHTML=`<div>${icon(c.shape)}</div><div>${c.number}</div><small>${c.shape}</small>`; div.onclick=()=>playCard(i); mh.appendChild(div);});
 let oh=document.getElementById('oppHand'); oh.innerHTML=''; opp.forEach(_=>{let div=document.createElement('div'); div.className='c'; div.innerHTML='🂠'; oh.appendChild(div);});
 if(my.length===0){ alert('YOU WIN! Golden wins! Pot '+(pot*0.9)); let winAmt=Math.floor(pot*0.9); addCredits(winAmt); credits=getCredits(); updateUI(); }
 if(opp.length===0){ alert('BLACK WINS! Opponent wins'); }
}
function icon(s){if(s==='circle')return '●'; if(s==='triangle')return '▲'; if(s==='cross')return '✚'; if(s==='square')return '■'; if(s==='star')return '★'; if(s==='whot')return 'W'; return s;}
function setStake(s){stake=s; pot=s*2; updateUI();}
function startLocal(){
 if(getCredits()<stake){ alert('Not enough credits! You have '+getCredits()+' need '+stake); return; }
 if(!deductCredits(stake)){ return; }
 credits=getCredits();
 deck=makeDeck(); my=[]; opp=[]; for(let i=0;i<5;i++){my.push(deck.pop()); opp.push(deck.pop());} center=deck.pop(); while([2,5,8,14].includes(center.number)){deck.unshift(center); center=deck.pop();} turn=1; pickAccum=0; document.getElementById('roomBadge').innerText='Local 2P'; document.getElementById('msg').innerText='Local start - Match shape or number. Golden starts'; updateUI();
}
function canPlay(card){
 if(center.shape==='whot') return true; // after whot choose shape handled via center.shape overwritten? we store currentShape in center.shape for simplicity after whot
 if(pickAccum>0){
  if(center.number===2 && card.number===2) return true;
  if(center.number===5 && card.number===5) return true;
  return false; // must defend or draw
 }
 if(card.shape==='whot') return true;
 if(card.shape===center.shape) return true;
 if(card.number===center.number) return true;
 return false;
}
function playCard(i){
 let card=my[i];
 if(turn!==1){ alert('Not your turn'); return; }
 if(!canPlay(card)){ alert(`Cannot play ${card.shape} ${card.number} on ${center.shape} ${center.number}`); return; }
 my.splice(i,1);
 // handle specials
 if(card.number===1){ // hold on
  center=card; updateUI(); document.getElementById('msg').innerText='Hold On! You go again'; // stay same turn
  pushRoom(); return;
 }
 if(card.number===2){ pickAccum+=2; center=card; }
 else if(card.number===5){ pickAccum+=3; center=card; }
 else if(card.number===8){ // suspension
  center=card; turn=1; // skip opponent, you again
  updateUI(); document.getElementById('msg').innerText='Suspension! Opponent skipped'; pushRoom(); return;
 }
 else if(card.number===14){ // general market
  center=card; pickAccum=0; // opponent picks 1?
  // opponent picks 1
  if(deck.length) opp.push(deck.pop());
  updateUI();
 }
 else if(card.number===20){ // whot
  let shape=prompt('WHOT! Choose shape: circle, triangle, cross, square, star'); if(!shape) shape='circle'; shape=shape.toLowerCase(); if(!shapes.includes(shape)) shape='circle';
  center={shape:shape,number:20}; // set chosen shape
  my.push({shape:'whot',number:20}) // remove? actually already removed
  my.pop(); // undo extra
  center.shape=shape; center.number=20;
  // keep card as whot with chosen shape
  // Actually set center to shape chosen with number 20
  center={shape:shape,number:20,chosen:true};
 }
 else {
  center=card;
 }
 if(card.number!==1 && card.number!==8){
  turn=turn===1?0:1;
  // AI opponent auto play if local
  if(!roomCode) setTimeout(aiPlay,800);
 }
 updateUI(); pushRoom();
}
function aiPlay(){
 if(turn!==0) return; if(opp.length===0) return;
 // if pick accum
 if(pickAccum>0){
  // try defend
  let defIdx=opp.findIndex(c=> (center.number===2 && c.number===2) || (center.number===5 && c.number===5));
  if(defIdx>=0){
   let c=opp.splice(defIdx,1)[0];
   if(c.number===2) pickAccum+=2; if(c.number===5) pickAccum+=3; center=c; document.getElementById('msg').innerText=`Opponent defends with ${c.number}`; turn=1; updateUI(); pushRoom(); return;
  } else {
   // pick
   for(let i=0;i<pickAccum;i++){ if(deck.length) opp.push(deck.pop()); } pickAccum=0; document.getElementById('msg').innerText=`Opponent picked ${pickAccum||''} cards`; turn=1; updateUI(); pushRoom(); return;
  }
 }
 let idx=opp.findIndex(c=>canPlay(c));
 if(idx>=0){
  let c=opp.splice(idx,1)[0];
  if(c.number===20){ let s=shapes[Math.floor(Math.random()*shapes.length)]; center={shape:s,number:20}; document.getElementById('msg').innerText=`Opponent WHOT chooses ${s}`; }
  else center=c;
  if(c.number===1){ document.getElementById('msg').innerText='Opponent Hold On'; turn=0; setTimeout(aiPlay,800); }
  else if(c.number===8){ document.getElementById('msg').innerText='Opponent Suspension - you skipped!'; turn=0; setTimeout(aiPlay,800); }
  else { turn=1; }
 } else {
  // draw
  if(deck.length) opp.push(deck.pop()); document.getElementById('msg').innerText='Opponent picked from market'; turn=1;
 }
 updateUI(); pushRoom();
}
function drawCard(){
 if(turn!==1){ alert('Not your turn'); return; }
 if(pickAccum>0){
  for(let i=0;i<pickAccum;i++){ if(deck.length) my.push(deck.pop()); } pickAccum=0; turn=0; document.getElementById('msg').innerText=`You picked ${pickAccum||''} cards - opponent turn`; setTimeout(aiPlay,800);
 } else {
  if(deck.length) my.push(deck.pop()); turn=0; document.getElementById('msg').innerText='You picked - opponent turn'; setTimeout(aiPlay,800);
 }
 updateUI(); pushRoom();
}

}
async function joinRoom(){
 let code=document.getElementById('roomInput').value.trim().toUpperCase(); if(!code)return alert('Enter code'); if(!window._fb || !window._currentUser) return alert('Sign Gmail'); roomCode=code; try{ const {doc,getDoc,db}=window._fb; let snap=await getDoc(doc(db,'whot_rooms',roomCode)); if(!snap.exists()) return alert('Room not found'); let d=snap.data(); deck=d.deck; my=d.oppHand; opp=d.myHand; center=d.center; turn=d.turn; document.getElementById('roomBadge').innerText='Room: '+roomCode+' Black'; updateUI(); listen(roomCode);}catch(e){alert(e.message)}
}
function listen(code){ if(unsub) unsub(); const {doc,onSnapshot,db}=window._fb; unsub=onSnapshot(doc(db,'whot_rooms',code),(s)=>{if(!s.exists())return; let d=s.data(); deck=d.deck; if(d.myHand) my=d.myHand; center=d.center; turn=d.turn; updateUI();});}
async function pushRoom(){ if(!roomCode||!window._fb)return; try{ const {doc,updateDoc,db}=window._fb; await updateDoc(doc(db,'whot_rooms',roomCode),{deck,myHand:my,oppHand:opp,center,turn});}catch(e){} }
setStake(100); startLocal();
