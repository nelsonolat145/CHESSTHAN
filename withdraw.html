<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>WITHDRAW - ETHAN EMPIRE</title>
<script>
function safeCredits(val, fallback){
  if(fallback===undefined) fallback=500;
  if(val===undefined||val===null) return fallback;
  let s=String(val).trim().toLowerCase();
  if(s==='undefined'||s==='nan'||s==='' ) return fallback;
  let n=parseInt(val);
  if(isNaN(n)) return fallback;
  return n;
}
(function(){
  let v=localStorage.getItem('ethan_credits');
  if(v===null||String(v).toLowerCase()==='undefined'||String(v).toLowerCase()==='nan'||v.trim()===''||isNaN(parseInt(v))){
    localStorage.setItem('ethan_credits','500');
  }
})();
</script>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">{"imports":{"firebase/app":"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js","firebase/auth":"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js","firebase/firestore":"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"}}</script>
<style>body{background:#080808;color:#FFD700;font-family:system-ui;padding:10px;text-align:center} .card{background:#151515;border:1px solid #FFD700;border-radius:12px;padding:12px;margin:10px auto;max-width:500px} .btn{background:#FFD700;color:#000;padding:12px;border:none;border-radius:10px;font-weight:800;width:100%;cursor:pointer;margin-top:6px} input,select{width:100%;padding:10px;background:#222;border:1px solid #444;color:#fff;border-radius:8px;margin-top:6px}</style></head><body>
<h1>💰 WITHDRAW REAL MONEY</h1>
<div class="card" style="display:flex;justify-content:space-between"><span id="authInfo">Checking...</span><button id="authBtn" class="btn" style="width:auto;padding:6px 12px">Sign Gmail</button></div>
<div class="card"><div style="font-size:20px">🪙 <b id="credits">500</b> credits = ₦<b id="naira">50</b></div><div style="font-size:11px;margin-top:4px">Min withdraw: 5000 credits = ₦500</div></div>
<div class="card"><h3>Request Withdrawal</h3>
<select id="bank"><option value="">Select Bank</option><option>Access Bank</option><option>GTB</option><option>First Bank</option><option>UBA</option><option>Zenith Bank</option><option>Opay</option><option>Palmpay</option><option>Moniepoint</option><option>Kuda</option><option>Other</option></select>
<input id="accNum" placeholder="Account Number (10 digits)"><input id="accName" placeholder="Account Name">
<input id="amountCredits" type="number" placeholder="Credits to withdraw (e.g. 5000)">
<div style="font-size:11px;margin-top:6px">You will receive: ₦<span id="receiveNaira">0</span></div>
<button class="btn" onclick="requestWithdraw()">Request Withdrawal</button></div>
<div class="card"><h3>My Withdrawals</h3><div id="history">Login to see history</div></div>
<script type="module">
import { initializeApp } from "firebase/app"; import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "firebase/auth"; import { getFirestore, doc, getDoc, setDoc, collection, addDoc, query, where, onSnapshot, orderBy, serverTimestamp, updateDoc } from "firebase/firestore";
const cfg={apiKey:"AIzaSyAQYSVdL5TkoSuU5acoaZQ-LaBEqOhFBRI",authDomain:"chessbyethan.firebaseapp.com",projectId:"chessbyethan",storageBucket:"chessbyethan.firebasestorage.app",messagingSenderId:"109137562341",appId:"1:109137562341:web:d39cc1cae0201564e4e20c"};
const app=initializeApp(cfg); const auth=getAuth(app); const db=getFirestore(app);
window._fb={auth,db,doc,getDoc,setDoc,collection,addDoc,query,where,onSnapshot,orderBy,serverTimestamp,updateDoc,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged};
const provider=new GoogleAuthProvider(); const authInfo=document.getElementById('authInfo'); const authBtn=document.getElementById('authBtn'); let currentUser=null, credits=safeCredits(localStorage.getItem('ethan_credits'),500);
function upd(){ document.getElementById('credits').innerText=credits; document.getElementById('naira').innerText=(credits*0.1).toFixed(0); }
upd();
authBtn.onclick=async()=>{ if(currentUser) await signOut(auth); else try{await signInWithPopup(auth,provider)}catch(e){alert(e.message)} };
onAuthStateChanged(auth,async(u)=>{ currentUser=u; if(u){authInfo.innerHTML=u.displayName; authBtn.textContent='Sign Out'; await loadCredits(); loadHistory();}else{authInfo.textContent='Sign Gmail to withdraw'; authBtn.textContent='Sign Gmail';}});
async function loadCredits(){
 const {doc,getDoc,db}=window._fb; let snap=await getDoc(doc(db,'chessbyethan_users',currentUser.uid));
 let localCred=safeCredits(localStorage.getItem('ethan_credits'),500);
 if(snap.exists()){
   let data=snap.data();
   if(data.credits!==undefined && data.credits!==null && !isNaN(parseInt(data.credits))){
     credits=safeCredits(data.credits,500);
   }else{
     credits=localCred;
     await setDoc(doc(db,'chessbyethan_users',currentUser.uid),{credits:credits},{merge:true});
   }
 }else{
   credits=localCred;
 }
 localStorage.setItem('ethan_credits',String(credits));
 document.getElementById('credits').innerText=credits; document.getElementById('naira').innerText=(credits*0.1).toFixed(0);
}
</script>
<script>
document.getElementById('amountCredits').addEventListener('input',e=>{ let c=safeCredits(e.target.value,0); document.getElementById('receiveNaira').innerText=(c*0.1).toFixed(0); });
async function requestWithdraw(){
 let bank=document.getElementById('bank').value, accNum=document.getElementById('accNum').value.trim(), accName=document.getElementById('accName').value.trim(), amount=safeCredits(document.getElementById('amountCredits').value,0);
 if(!window._fb || !window._fb.auth.currentUser) return alert('Sign Gmail first');
 if(!bank||accNum.length<10||!accName||!amount) return alert('Fill all fields');
 if(amount<5000) return alert('Min 5000 credits = ₦500');
 if(amount>credits) return alert('Not enough credits. You have '+credits);
 let naira=amount*0.1;
 if(!confirm(`Withdraw ${amount} credits = ₦${naira} to ${bank} ${accNum} (${accName})?`)) return;
 const {collection,addDoc,doc,updateDoc,serverTimestamp,db}=window._fb;
 let uid=window._fb.auth.currentUser.uid;
 try{
  await addDoc(collection(db,'ethan_withdrawals'),{userId:uid,email:window._fb.auth.currentUser.email,bank,accountNumber:accNum,accountName:accName,credits:amount,naira,status:'pending',createdAt:serverTimestamp()});
  let newCredits=credits-amount;
  await updateDoc(doc(db,'chessbyethan_users',uid),{credits:newCredits});
  localStorage.setItem('ethan_credits',String(newCredits));
  credits=newCredits; document.getElementById('credits').innerText=credits; document.getElementById('naira').innerText=(credits*0.1).toFixed(0);
  alert('Withdrawal requested! Admin will pay ₦'+naira+' within 24h.');
 }catch(e){alert('Error '+e.message)}
}
async function loadHistory(){
 const {collection,query,where,orderBy,onSnapshot,db}=window._fb;
 let uid=window._fb.auth.currentUser.uid;
 let q=query(collection(db,'ethan_withdrawals'),where('userId','==',uid),orderBy('createdAt','desc'));
 onSnapshot(q,snap=>{ let div=document.getElementById('history'); div.innerHTML=''; if(snap.empty){div.innerHTML='No withdrawals yet'; return;} snap.forEach(d=>{let data=d.data(); let t=data.createdAt?.toDate?data.createdAt.toDate().toLocaleString():''; div.innerHTML+=`<div style="border:1px solid #333;border-radius:8px;padding:8px;margin:4px;text-align:left;font-size:12px"><b>${data.status.toUpperCase()}</b> - ${t}<br>${data.bank} ${data.accountNumber}<br>Credits ${data.credits} = ₦${data.naira}</div>`;}); });
}
</script></body></html>
