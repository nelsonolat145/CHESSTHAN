<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SNAKE LADDER - Black & Golden</title>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "firebase/app": "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js",
    "firebase/auth": "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js",
    "firebase/firestore": "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js"
  }
}
</script>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
:root{--black:#000;--gold:#FFD700;--gold2:#b89600;--panel:#0a0a0a;--panel2:#141414}
*{box-sizing:border-box;margin:0;padding:0;font-family:Inter,Segoe UI,Arial}
body{background:var(--black);color:var(--gold);min-height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:10px 14px;background:var(--panel);border-bottom:2px solid var(--gold);box-shadow:0 0 18px rgba(255,215,0,.35);position:sticky;top:0;z-index:50}
.brand{font-weight:900;letter-spacing:2px;font-size:18px;text-shadow:0 0 8px var(--gold)}
.group{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1.5px solid var(--gold);background:black;color:var(--gold);padding:7px 12px;border-radius:10px;cursor:pointer;font-weight:700;box-shadow:0 0 10px rgba(255,215,0,.25);transition:.2s}
.btn:hover{background:var(--gold);color:black;box-shadow:0 0 18px var(--gold)}
.btn.active{background:var(--gold);color:black}
.btn.small{padding:5px 9px;font-size:12px}
.input{border:1px solid var(--gold);background:#111;color:var(--gold);padding:7px 10px;border-radius:8px;outline:none}
.wallet{display:flex;align-items:center;gap:6px;border:1px solid var(--gold);padding:6px 10px;border-radius:12px;background:rgba(255,215,0,.08)}
.main{flex:1;display:flex;gap:16px;padding:16px;flex-wrap:wrap;justify-content:center}
.left-panel,.right-panel{background:var(--panel2);border:1.5px solid var(--gold);border-radius:16px;padding:12px;box-shadow:0 0 20px rgba(255,215,0,.15)}
.left-panel{width:340px;min-width:280px;display:flex;flex-direction:column;gap:12px}
.board-wrap{position:relative;width:min(92vw,560px);height:min(92vw,560px);background:radial-gradient(circle at 20% 20%, #1a1a1a, #000);border:2.5px solid var(--gold);border-radius:18px;overflow:hidden;box-shadow:0 0 30px rgba(255,215,0,.35)}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(10,1fr);grid-template-rows:repeat(10,1fr)}
.cell{border:0.5px solid rgba(255,215,0,.22);position:relative;display:flex;align-items:flex-start;justify-content:flex-start;padding:2px;font-size:10px;color:rgba(255,215,0,.9)}
.cell.even{background:rgba(255,215,0,.04)}
.cell .num{font-weight:800;text-shadow:0 0 4px gold}
.cell.start{background:rgba(255,215,0,.14)}
.cell.finish{background:rgba(255,215,0,.25);font-weight:900}
.svg-layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.token{position:absolute;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:14px;transform:translate(-50%,-50%);transition:all .45s cubic-bezier(.3,1.5,.6,1);z-index:5;box-shadow:0 0 12px currentColor}
.token.black{background:black;border:2px solid white;color:white;box-shadow:0 0 14px white}
.token.gold{background:var(--gold);border:2px solid black;color:black;box-shadow:0 0 14px var(--gold)}
.status{padding:10px;border:1px dashed var(--gold);border-radius:12px;background:rgba(0,0,0,.6);text-align:center}
.dice{width:76px;height:76px;border:2.5px solid var(--gold);border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:900;background:black;box-shadow:0 0 18px rgba(255,215,0,.4);cursor:pointer;user-select:none}
.dice.rolling{animation:shake .4s infinite}
@keyframes shake{0%{transform:rotate(0)}25%{transform:rotate(8deg)}50%{transform:rotate(-8deg)}75%{transform:rotate(5deg)}}
.pot{font-size:13px;opacity:.9}
.log{max-height:160px;overflow:auto;font-size:12px;display:flex;flex-direction:column;gap:4px}
.log div{border-bottom:1px solid rgba(255,215,0,.12);padding:2px 0}
.glow{box-shadow:0 0 12px var(--gold)!important}
@media(max-width:900px){.main{flex-direction:column;align-items:center}.left-panel{width:95vw}}
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">SNAKE LADDER — BLACK & GOLDEN</div>
  <div class="group">
    <span id="authLabel">Guest</span>
    <button class="btn small" id="loginBtn">Gmail Login</button>
    <button class="btn small" id="logoutBtn" style="display:none">Logout</button>
  </div>
  <div class="group">
    <div class="wallet">💰 <span id="creditVal">0</span> CREDITS <button class="btn small" onclick="buyCredits(1000)">+ Buy</button></div>
    <div class="group" id="stakeGroup">
      <span>Stake:</span>
      <button class="btn small stakeBtn" data-stake="100">100</button>
      <button class="btn small stakeBtn active" data-stake="500">500</button>
      <button class="btn small stakeBtn" data-stake="1000">1000</button>
      <button class="btn small stakeBtn" data-stake="5000">5000</button>
    </div>
  </div>
  <div class="group">
    <button class="btn small" id="localBtn">Local 2P</button>
    <button class="btn small" id="createBtn">Create Room</button>
    <input class="input" id="roomCodeInput" placeholder="SNAK-XXXX" style="width:110px"/>
    <button class="btn small" id="joinBtn">Join Room</button>
    <span id="roomLabel" class="pot">Offline</span>
  </div>
</div>

<div class="main">
  <div class="left-panel">
    <div class="group" style="justify-content:space-between">
      <div class="status" style="flex:1">
        <div>Pot: <b id="potVal">0</b></div>
        <div style="font-size:11px">Winner gets 90%</div>
      </div>
      <div class="dice" id="diceEl">🎲</div>
    </div>
    <div id="turnInfo" class="status">Black's Turn — Roll Dice</div>
    <button class="btn" id="rollBtn" style="width:100%;padding:14px;font-size:16px">ROLL DICE (1-6)</button>
    <div class="group" style="justify-content:space-between">
      <div><span style="color:white">●</span> Black: <b id="posBlack">1</b></div>
      <div><span style="color:var(--gold)">●</span> Golden: <b id="posGold">1</b></div>
    </div>
    <div class="status pot" id="actionMsg">First to 100 wins (exact roll). Land on ladder bottom to climb, snake head to slide.</div>
    <div class="log" id="gameLog"></div>
    <button class="btn small" id="resetBtn">Reset Local Game</button>
  </div>

  <div class="board-wrap" id="boardWrap">
    <div class="grid" id="grid"></div>
    <svg class="svg-layer" id="svgLayer"></svg>
    <div class="token black" id="tokenBlack">♟</div>
    <div class="token gold" id="tokenGold">♛</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "firebase/app";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "firebase/auth";
import { getFirestore, doc, setDoc, getDoc, onSnapshot, updateDoc } from "firebase/firestore";

const firebaseConfig = {
  apiKey: "AIzaSyAQYSVdL5TkoSuU5acoaZQ-LaBEqOhFBRI",
  authDomain: "chessbyethan.firebaseapp.com",
  projectId: "chessbyethan",
  storageBucket: "chessbyethan.appspot.com",
  messagingSenderId: "109874845318",
  appId: "1:109874845318:web:2e7a5d4f7e1c9a8b6c3d2"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

// ----- SHARED WALLET -----
let credits = parseInt(localStorage.getItem('ethan_credits')||'2000');
let stake = 500;
function saveCredits(){localStorage.setItem('ethan_credits', credits); document.getElementById('creditVal').textContent=credits; updatePot();}
function updatePot(){const players = currentRoom ? 2 : 2; document.getElementById('potVal').textContent = stake*players; }
saveCredits();

window.buyCredits = function(amount=1000){
  const handler = PaystackPop.setup({
    key: "pk_live_ec06b408bfb5c633263ee48346288df5df7f",
    email: auth.currentUser?.email || "player@snakeblackgold.com",
    amount: amount*100,
    currency: "NGN",
    callback: function(res){
      credits += amount;
      saveCredits();
      log(`+${amount} credits bought. Ref ${res.reference}`);
      alert(`Credited ${amount} credits!`);
    },
    onClose: ()=> log("Paystack closed")
  });
  handler.openIframe();
};

document.querySelectorAll('.stakeBtn').forEach(b=>{
  b.onclick=()=>{document.querySelectorAll('.stakeBtn').forEach(x=>x.classList.remove('active')); b.classList.add('active'); stake=parseInt(b.dataset.stake); updatePot();}
});

// ----- AUTH -----
const authLabel=document.getElementById('authLabel');
document.getElementById('loginBtn').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){alert(e.message)}};
document.getElementById('logoutBtn').onclick=()=>signOut(auth);
onAuthStateChanged(auth,user=>{
  if(user){authLabel.textContent=user.displayName||user.email; document.getElementById('loginBtn').style.display='none'; document.getElementById('logoutBtn').style.display='inline-block'}
  else{authLabel.textContent='Guest'; document.getElementById('loginBtn').style.display='inline-block'; document.getElementById('logoutBtn').style.display='none'}
});

// ----- BOARD DATA -----
const snakes = {99:54,70:55,52:42,56:8,43:17,50:5,27:5,36:6,54:31}; // black snakes head->tail (higher->lower)
const ladders = {2:23,6:45,20:59,30:49,57:96,72:90,75:86,80:100,28:84}; // golden ladders

const positions = {black:1,gold:1};
let turn='black';
let diceVal=1;
let gameOver=false;
let currentRoom=null;
let roomUnsub=null;
let mode='local'; // local, host, guest
let roomColor=null; // which token we control in online

// ----- BOARD RENDERING -----
const grid=document.getElementById('grid');
const svgLayer=document.getElementById('svgLayer');
const boardWrap=document.getElementById('boardWrap');

function posToRC(pos){
  const rowFromBottom=Math.floor((pos-1)/10);
  const posInRow=(pos-1)%10;
  const col = (rowFromBottom%2===0) ? posInRow : 9-posInRow;
  const row = 9 - rowFromBottom;
  return {row,col,rowFromBottom,colVisual:col};
}
function rcToCenter(row,col){
  const cw=boardWrap.clientWidth/10;
  const ch=boardWrap.clientHeight/10;
  return {x:col*cw+cw/2,y:row*ch+ch/2,cw,ch};
}

function buildBoard(){
  grid.innerHTML='';
  for(let r=0;r<10;r++){
    for(let c=0;c<10;c++){
      const rowFromBottom=9-r;
      const isEvenRow = rowFromBottom%2===0;
      const posInRow = isEvenRow? c : 9-c;
      const pos = rowFromBottom*10 + posInRow +1;
      const cell=document.createElement('div');
      cell.className='cell'+( (r+c)%2===0?' even':'');
      if(pos===1)cell.classList.add('start');
      if(pos===100)cell.classList.add('finish');
      cell.innerHTML=`<span class="num">${pos}</span>`;
      if(snakes[pos]) cell.style.boxShadow='inset 0 0 0 2px white';
      if(ladders[pos]) cell.style.boxShadow='inset 0 0 0 2px gold';
      grid.appendChild(cell);
    }
  }
  drawLines();
}

function drawLines(){
  const svgW=boardWrap.clientWidth, svgH=boardWrap.clientHeight;
  svgLayer.setAttribute('viewBox',`0 0 ${svgW} ${svgH}`);
  svgLayer.innerHTML='';
  // snakes black lines
  Object.entries(snakes).forEach(([h,t])=>{
    const hr=posToRC(+h), tr=posToRC(+t);
    const a=rcToCenter(hr.row,hr.col), b=rcToCenter(tr.row,tr.col);
    const path=document.createElementNS("http://www.w3.org/2000/svg","path");
    const dx=(b.x-a.x)*0.3;
    path.setAttribute('d',`M ${a.x} ${a.y} C ${a.x+dx} ${a.y+60}, ${b.x-dx} ${b.y-60}, ${b.x} ${b.y}`);
    path.setAttribute('stroke','white'); path.setAttribute('stroke-width','3'); path.setAttribute('fill','none');
    path.setAttribute('stroke-dasharray','8 6'); path.setAttribute('opacity','0.9');
    path.style.filter='drop-shadow(0 0 6px white)';
    svgLayer.appendChild(path);
    const txt=document.createElementNS("http://www.w3.org/2000/svg","text");
    txt.setAttribute('x',a.x); txt.setAttribute('y',a.y-8); txt.setAttribute('fill','white'); txt.setAttribute('font-size','11'); txt.textContent='🐍'+h+'→'+t;
    svgLayer.appendChild(txt);
  });
  Object.entries(ladders).forEach(([b,t])=>{
    const br=posToRC(+b), tr=posToRC(+t);
    const a=rcToCenter(br.row,br.col), c=rcToCenter(tr.row,tr.col);
    const line=document.createElementNS("http://www.w3.org/2000/svg","line");
    line.setAttribute('x1',a.x); line.setAttribute('y1',a.y); line.setAttribute('x2',c.x); line.setAttribute('y2',c.y);
    line.setAttribute('stroke','#FFD700'); line.setAttribute('stroke-width','4'); line.setAttribute('opacity','0.95');
    line.style.filter='drop-shadow(0 0 8px gold)';
    svgLayer.appendChild(line);
    const txt=document.createElementNS("http://www.w3.org/2000/svg","text");
    txt.setAttribute('x',a.x); txt.setAttribute('y',a.y+14); txt.setAttribute('fill','#FFD700'); txt.setAttribute('font-size','11'); txt.textContent='🪜'+b+'→'+t;
    svgLayer.appendChild(txt);
  });
}

function placeTokens(){
  ['black','gold'].forEach(color=>{
    const el=document.getElementById(color==='black'?'tokenBlack':'tokenGold');
    const rc=posToRC(positions[color]);
    const {x,y}=rcToCenter(rc.row,rc.col);
    const offset = color==='black'?-8:8;
    el.style.left=(x+offset)+'px';
    el.style.top=(y+offset)+'px';
  });
  document.getElementById('posBlack').textContent=positions.black;
  document.getElementById('posGold').textContent=positions.gold;
}

function log(msg){const l=document.getElementById('gameLog'); const d=document.createElement('div'); d.textContent=new Date().toLocaleTimeString()+' '+msg; l.prepend(d);}

function checkSpecial(pos){
  if(ladders[pos]){log(`Ladder! ${pos} → ${ladders[pos]}`); return ladders[pos];}
  if(snakes[pos]){log(`Snake bite! ${pos} → ${snakes[pos]}`); return snakes[pos];}
  return pos;
}

function win(winner){
  gameOver=true;
  const winnerName = winner==='black'?'BLACK':'GOLDEN';
  const pot = stake*2;
  const prize = Math.floor(pot*0.9);
  if(!currentRoom){
    if(winner==='black'){credits+=prize; log(`Black wins +${prize}`);} // in local just credit winner? keep simple
    saveCredits();
  }
  document.getElementById('turnInfo').textContent=`🏆 ${winnerName} WINS! Prize ${prize}`;
  document.getElementById('actionMsg').textContent=`${winnerName} reached 100! Pot ${pot} → winner 90% = ${prize}`;
  if(currentRoom && roomColor===winner){
    credits+=prize; saveCredits(); log(`You won ${prize} credits!`);
  }
  if(currentRoom){
    updateDoc(doc(db,'snake_rooms',currentRoom),{winner, status:'finished'});
  }
}

async function doMove(roll){
  if(gameOver) return;
  if(currentRoom && roomColor && turn!==roomColor){log("Not your turn"); return;}
  if(currentRoom && credits < stake){alert("Not enough credits"); return;}

  const player=turn;
  const cur=positions[player];
  let next=cur+roll;
  if(next>100){ log(`${player} needs ${100-cur} exact, rolled ${roll}`); switchTurn(); return; }
  log(`${player} rolled ${roll}: ${cur} → ${next}`);
  positions[player]=next;
  placeTokens();
  await new Promise(r=>setTimeout(r,400));
  const final=checkSpecial(next);
  if(final!==next){positions[player]=final; placeTokens(); await new Promise(r=>setTimeout(r,400));}
  if(positions[player]===100){ win(player); return;}
  switchTurn();
  if(currentRoom){
    await updateDoc(doc(db,'snake_rooms',currentRoom),{positions:{...positions}, turn, dice:diceVal, lastMove:Date.now()});
  }
}

function switchTurn(){turn= turn==='black'?'gold':'black'; document.getElementById('turnInfo').textContent=`${turn.toUpperCase()}'s Turn — ${turn===roomColor||!currentRoom?'Your':'Opponent'} roll`; document.getElementById('turnInfo').className='status'+(turn==='gold'?' glow':''); if(currentRoom){ /* auto flip concept for black player view */ if(turn==='black'){boardWrap.style.transform='rotate(180deg)'; grid.style.transform='rotate(180deg)'; svgLayer.style.transform='rotate(180deg)'; document.querySelectorAll('.token').forEach(t=>t.style.transform='translate(-50%,-50%) rotate(180deg)');} else {boardWrap.style.transform=''; grid.style.transform=''; svgLayer.style.transform=''; document.querySelectorAll('.token').forEach(t=>t.style.transform='translate(-50%,-50%)');} } }

function rollDice(){
  const diceEl=document.getElementById('diceEl');
  diceEl.classList.add('rolling');
  let cnt=0; const iv=setInterval(()=>{diceEl.textContent=Math.ceil(Math.random()*6); cnt++; if(cnt>10){clearInterval(iv); diceEl.classList.remove('rolling'); diceVal=Math.ceil(Math.random()*6); diceEl.textContent=diceVal; doMove(diceVal);} },80);
}

// listeners
document.getElementById('rollBtn').onclick=rollDice;
document.getElementById('diceEl').onclick=rollDice;

document.getElementById('resetBtn').onclick=()=>{
  positions.black=1; positions.gold=1; turn='black'; gameOver=false; diceVal=1; document.getElementById('diceEl').textContent='🎲'; placeTokens(); document.getElementById('turnInfo').textContent="Black's Turn"; log("Game reset");
};

document.getElementById('localBtn').onclick=()=>{
  if(roomUnsub) roomUnsub(); currentRoom=null; roomColor=null; mode='local'; document.getElementById('roomLabel').textContent='Local 2P'; positions.black=1; positions.gold=1; turn='black'; gameOver=false; placeTokens(); log("Local 2P mode"); boardWrap.style.transform=''; grid.style.transform=''; svgLayer.style.transform=''; document.querySelectorAll('.token').forEach(t=>t.style.transform='translate(-50%,-50%)');
};

function genCode(){return 'SNAK-'+Math.random().toString(36).substring(2,6).toUpperCase();}
document.getElementById('createBtn').onclick=async()=>{
  if(!auth.currentUser){alert("Login with Gmail first to create room"); return;}
  if(credits<stake){alert("Not enough credits for stake "+stake); return;}
  const code=genCode();
  const roomDoc=doc(db,'snake_rooms',code);
  const payload={
    code,
    host:auth.currentUser.uid,
    hostEmail:auth.currentUser.email,
    stake,
    status:'waiting',
    positions:{black:1,gold:1},
    turn:'black',
    createdAt:Date.now(),
    players:1
  };
  await setDoc(roomDoc,payload);
  currentRoom=code; roomColor='black'; mode='host'; document.getElementById('roomLabel').textContent=code+' (Host Black)'; log(`Room ${code} created as Black`);
  credits-=stake; saveCredits();
  listenRoom(code);
};

document.getElementById('joinBtn').onclick=async()=>{
  const code=document.getElementById('roomCodeInput').value.trim().toUpperCase();
  if(!code){alert("Enter room code"); return;}
  if(!auth.currentUser){alert("Login first"); return;}
  if(credits<stake){alert("Not enough credits"); return;}
  const rdoc=doc(db,'snake_rooms',code);
  const snap=await getDoc(rdoc);
  if(!snap.exists()){alert("Room not found"); return;}
  const data=snap.data();
  if(data.status!=='waiting'){alert("Room full or finished"); return;}
  await updateDoc(rdoc,{guest:auth.currentUser.uid, guestEmail:auth.currentUser.email, status:'playing', players:2});
  currentRoom=code; roomColor='gold'; mode='guest'; document.getElementById('roomLabel').textContent=code+' (Guest Golden)'; log(`Joined ${code} as Golden`);
  credits-=stake; saveCredits();
  positions.black=data.positions.black; positions.gold=data.positions.gold; turn=data.turn; placeTokens();
  listenRoom(code);
};

function listenRoom(code){
  if(roomUnsub) roomUnsub();
  const rdoc=doc(db,'snake_rooms',code);
  roomUnsub=onSnapshot(rdoc,(snap)=>{
    if(!snap.exists()) return;
    const d=snap.data();
    positions.black=d.positions.black; positions.gold=d.positions.gold; turn=d.turn; if(d.dice) diceVal=d.dice;
    placeTokens();
    document.getElementById('diceEl').textContent=d.dice||'🎲';
    if(d.winner){win(d.winner); return;}
    if(d.status==='playing') document.getElementById('turnInfo').textContent=`Online ${code}: ${turn.toUpperCase()} turn ${turn===roomColor?'(You)':'(Opp)'}`;
  });
}

// init
buildBoard();
placeTokens();
window.addEventListener('resize',()=>{drawLines(); placeTokens();});
setTimeout(()=>{drawLines(); placeTokens();},300);
log("Welcome to Black & Golden Snake Ladder — exact 100 wins!");
</script>
</body>
</html>
