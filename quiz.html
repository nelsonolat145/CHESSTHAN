<style>
:root{--black:#000;--gold:#FFD700;--gold2:#c9a600;--dark:#111;--card:#151515;--border:2px solid var(--gold);--glow:0 0 18px rgba(255,215,0,.45);}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#000;color:var(--gold);font-family:'Inter',sans-serif;min-height:100vh;display:flex;flex-direction:column;}
h1,h2,.bebas{font-family:'Bebas Neue',sans-serif;letter-spacing:1px}
.topbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:var(--border);background:#000;position:sticky;top:0;z-index:10;box-shadow:var(--glow)}
.top-left,.top-mid,.top-right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{background:#000;color:var(--gold);border:2px solid var(--gold);padding:8px 14px;border-radius:10px;font-weight:800;cursor:pointer;transition:.2s;box-shadow:var(--glow);text-transform:uppercase;font-size:12px}
.btn:hover{background:var(--gold);color:#000;transform:translateY(-1px)}
.btn.active{background:var(--gold);color:#000}
.btn.small{padding:6px 10px;font-size:11px}
.inp{background:#111;border:2px solid var(--gold);color:var(--gold);padding:8px 12px;border-radius:10px;outline:none;min-width:140px}
.inp::placeholder{color:#665c00}
.wallet{background:linear-gradient(135deg,#1a1a00,#000);border:2px solid var(--gold);padding:8px 12px;border-radius:12px;display:flex;gap:10px;align-items:center;box-shadow:var(--glow)}
.stake-row{display:flex;gap:6px}
.stake-btn{border:2px solid var(--gold);background:#000;color:var(--gold);padding:6px 10px;border-radius:999px;font-weight:800;font-size:11px;cursor:pointer}
.stake-btn.active,.stake-btn:hover{background:var(--gold);color:#000}
#main{flex:1;display:flex;flex-direction:column;align-items:center;padding:20px;gap:18px}
.mode-bar{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.card{width:100%;max-width:820px;background:var(--card);border:var(--border);border-radius:18px;box-shadow:var(--glow);padding:20px}
.scoreboard{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}
.player-box{flex:1;border:2px solid var(--gold);border-radius:14px;padding:12px;text-align:center;background:#000;transition:.3s}
.player-box.turn{transform:scale(1.04);box-shadow:0 0 25px rgba(255,215,0,.7);background:#1a1600}
.player-box.winner{border-color:#fff;box-shadow:0 0 35px var(--gold)}
.p-name{font-weight:800;font-size:13px;opacity:.9}
.p-score{font-family:'Bebas Neue';font-size:42px;line-height:1}
.p-meta{font-size:11px;opacity:.7}
.q-meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:12px;font-weight:800}
.badge{border:2px solid var(--gold);padding:4px 10px;border-radius:999px;background:#000}
.timer-bar{height:10px;background:#222;border:2px solid var(--gold);border-radius:999px;overflow:hidden;margin-bottom:14px}
.timer-fill{height:100%;background:linear-gradient(90deg,var(--gold),#fff);width:100%;transition:width .1s linear}
.question-text{font-size:22px;font-weight:800;line-height:1.25;margin-bottom:18px;min-height:60px}

function renderWallet(){ document.getElementById('creditBal').textContent=getCredits(); updatePot(); }

  const stake=window._stake||100;
  const players=window._playersCount||2;

  document.getElementById('potInfo').textContent='Winner 90% = '+(Math.floor(pot*0.9));

// --- GAME STATE ---
let mode='local'; // local, online_host, online_join
let roomCode=null;
let unsub=null;
let gameState=null;
let timerInt=null;
let qStartTime=0;
let timeLeft=15;
let localTurn=0; // 0=p1 answering, 1=p2 answering same Q
let localQIdx=0;
let matchQs=[];
let scores=[0,0];
let answered=[false,false]; // for local same Q, whether each player answered
let currentAnswers=[null,null];
let isOnline=false;
let isHost=false;

function log(m){ const el=document.getElementById('gameLog'); el.innerHTML='<div>> '+m+'</div>'+el.innerHTML; }

function setMode(m){
  mode=m;
  isOnline = m.startsWith('online');
  document.getElementById('modeLabel').textContent='MODE: '+m.toUpperCase();
}
window.setMode = setMode;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a;}

function pickQuestions(n=10){
  const copy=[...QUESTIONS];
  shuffle(copy);
  return copy.slice(0,n);
}

function startGame(){
  const p1=document.getElementById('p1Name').value||'Player 1';
  const p2=document.getElementById('p2Name').value||'Player 2';
  window._playersCount=2;
  if(getCredits() < window._stake){ alert('Not enough credits! Buy credits.'); return; }
  // deduct stake
  setCredits(getCredits()-window._stake);
  if(isOnline){
    if(!roomCode){ alert('Create or Join room first'); return; }
    // online start handled by room creation
    return;
  }
  // LOCAL
  document.getElementById('setupCard').classList.add('hidden');
  document.getElementById('gameCard').classList.remove('hidden');
  document.getElementById('p1NameDisp').textContent=p1.toUpperCase();
  document.getElementById('p2NameDisp').textContent=p2.toUpperCase();
  matchQs=pickQuestions(10);
  scores=[0,0];
  localQIdx=0;
  localTurn=0;
  answered=[false,false];
  currentAnswers=[null,null];
  renderScores();
  nextLocalQuestion();
}
window.startGame=startGame;

function renderScores(){
  document.getElementById('p1Score').textContent=scores[0];
  document.getElementById('p2Score').textContent=scores[1];
  document.getElementById('p1Box').classList.toggle('turn', !isOnline ? localTurn===0 : false);
  document.getElementById('p2Box').classList.toggle('turn', !isOnline ? localTurn===1 : false);
}

function nextLocalQuestion(){
  if(localQIdx>=10){ endGame(); return; }
  const q=matchQs[localQIdx];
  document.getElementById('qCount').textContent=`Q ${localQIdx+1}/10`;
  document.getElementById('qCat').textContent=q.cat.toUpperCase();
  document.getElementById('qText').textContent=q.q;
  const optsDiv=document.getElementById('opts');
  optsDiv.innerHTML='';
  q.opts.forEach((o,i)=>{
    const b=document.createElement('button');
    b.className='opt';
    b.textContent=(['A','B','C','D'][i]+'. '+o);
    b.onclick=()=>handleLocalAnswer(i);
    optsDiv.appendChild(b);
  });
  document.getElementById('feedback').textContent = (localTurn===0? document.getElementById('p1NameDisp').textContent : document.getElementById('p2NameDisp').textContent) + ' turn - answer!';
  // auto flip visual if black player turn (gold border flip concept)
  document.getElementById('gameCard').style.transform = localTurn===1 ? 'rotateX(2deg)' : 'none';
  startTimer(()=>{ // timeout
    handleLocalAnswer(-1,true);
  });
}

function handleLocalAnswer(idx,timeout=false){
  stopTimer();
  const q=matchQs[localQIdx];
  const correct=q.a;
  const opts=document.querySelectorAll('.opt');
  opts.forEach((b,i)=>{
    b.classList.add('disabled');
    if(i===correct) b.classList.add('correct');
    if(i===idx && idx!==correct) b.classList.add('wrong');
  });
  let pts=0;
  if(idx===correct){
    const elapsed=15-timeLeft;
    const speedBonus=Math.max(0, Math.floor((15-elapsed)* (100/15) )); // faster = more
    pts = 20 + speedBonus; // max 120? cap 100
    if(pts>100) pts=100;
    if(timeout) pts=0;
  }
  scores[localTurn]+=pts;
  currentAnswers[localTurn]=idx;
  answered[localTurn]=true;
  renderScores();
  document.getElementById('feedback').textContent = (idx===correct? `CORRECT +${pts}` : (idx===-1? 'TIME UP!':'WRONG')) + ` - ${q.opts[correct]}`;
  setTimeout(()=>{
    if(localTurn===0){
      localTurn=1;
      // same question second player
      renderScores();
      const q2=matchQs[localQIdx];
      const optsDiv=document.getElementById('opts');
      optsDiv.innerHTML='';
      q2.opts.forEach((o,i)=>{
        const b=document.createElement('button');
        b.className='opt';
        b.textContent=(['A','B','C','D'][i]+'. '+o);
        b.onclick=()=>handleLocalAnswer(i);
        optsDiv.appendChild(b);
      });
      document.getElementById('feedback').textContent = document.getElementById('p2NameDisp').textContent + ' turn - same question!';
      document.getElementById('gameCard').style.transform='rotateX(2deg)';
      startTimer(()=>{ handleLocalAnswer(-1,true); });
    } else {
      // both done, next Q
      localQIdx++;
      localTurn=0;
      answered=[false,false];
      nextLocalQuestion();
    }
  },1500);
}

function startTimer(onExpire){
  timeLeft=15;
  qStartTime=Date.now();
  const fill=document.getElementById('timerFill');
  const txt=document.getElementById('qTimerText');
  fill.style.width='100%';
  clearInterval(timerInt);
  timerInt=setInterval(()=>{
    const elapsed=(Date.now()-qStartTime)/1000;
    timeLeft=Math.max(0,15-elapsed);
    txt.textContent=timeLeft.toFixed(1)+'s';
    fill.style.width=(timeLeft/15*100)+'%';
    if(timeLeft<=0){ clearInterval(timerInt); onExpire(); }
  },80);
}
function stopTimer(){ clearInterval(timerInt); }

function endGame(){
  stopTimer();
  const p1Name=document.getElementById('p1NameDisp').textContent;
  const p2Name=document.getElementById('p2NameDisp').textContent;
  let winnerIdx = scores[0]>=scores[1]?0:1;
  let winnerName = winnerIdx===0?p1Name:p2Name;
  const pot=window._stake*2;
  const winAmt=Math.floor(pot*0.9);
  document.getElementById('winTitle').textContent = winnerName+' WINS!';
  document.getElementById('winDetails').textContent=`${p1Name}: ${scores[0]} pts | ${p2Name}: ${scores[1]} pts - 10 Questions`;
  document.getElementById('winPot').textContent='WIN: NGN '+winAmt;
  document.getElementById('winnerOverlay').classList.remove('hidden');
  // credit winner if local, give to winner wallet? For local, we add to local wallet as winner pot
  const cur=getCredits();
  setCredits(cur+winAmt);
  log(`Game over winner ${winnerName} +${winAmt}`);
}

window.closeWinner=()=>{
  document.getElementById('winnerOverlay').classList.add('hidden');
  document.getElementById('gameCard').classList.add('hidden');
  document.getElementById('setupCard').classList.remove('hidden');
};

// --- ONLINE ROOMS ---
async function createRoom(){
  if(!window._fb){ alert('Firebase loading...'); return; }
  const {doc, setDoc, collection, db} = {doc:window._fb.doc, setDoc:window._fb.setDoc, collection:window._fb.collection, db:window._fb.db};
  const code='QUIZ-'+Math.random().toString(36).slice(2,6).toUpperCase();
  roomCode=code;
  isHost=true;
  isOnline=true;
  setMode('online_host');
  matchQs=pickQuestions(10);
  const payload={
    code:code,
    createdAt: Date.now(),
    hostName: (window._fb.auth.currentUser?.displayName||document.getElementById('p1Name').value||'Host'),
    hostId: window._fb.auth.currentUser?.uid||'host_'+Math.random().toString(36).slice(2),
    joinName: '',
    joinId:'',
    questions: matchQs,
    currentIdx:0,
    scores:{host:0,join:0},
    status:'waiting',
    answers:{host:null,join:null},
    stake: window._stake
  };
  // Use collection quiz_rooms
  try{
    await setDoc(doc(db,'quiz_rooms',code), payload);
    document.getElementById('roomCodeDisplay').textContent=code;
    document.getElementById('roomInfo').classList.remove('hidden');
    document.getElementById('roomLabel').textContent='ROOM: '+code; document.getElementById('roomLabel').classList.remove('hidden');
    document.getElementById('setupCard').classList.remove('hidden');
    log('Room created '+code);
    listenRoom(code);
  }catch(e){ alert('Firestore error '+e.message); }
}
window.createRoom=createRoom;

async function joinRoom(){
  const codeInput=document.getElementById('joinCode').value.trim().toUpperCase();
  if(!codeInput){ alert('Enter code'); return; }
  const {doc, getDoc, updateDoc, db} = {doc:window._fb.doc, getDoc:window._fb.getDoc, updateDoc:window._fb.updateDoc, db:window._fb.db};
  try{
    const snap=await getDoc(doc(db,'quiz_rooms',codeInput));
    if(!snap.exists()){ alert('Room not found'); return; }
    roomCode=codeInput;
    isHost=false;
    isOnline=true;
    setMode('online_join');
    const myName=document.getElementById('p2Name').value||(window._fb.auth.currentUser?.displayName||'Guest');
    const myId=window._fb.auth.currentUser?.uid||'join_'+Math.random().toString(36).slice(2);
    await updateDoc(doc(db,'quiz_rooms',codeInput), {joinName:myName, joinId:myId, status:'ready'});
    document.getElementById('roomLabel').textContent='ROOM: '+codeInput; document.getElementById('roomLabel').classList.remove('hidden');
    log('Joined '+codeInput);
    listenRoom(codeInput);
  }catch(e){ alert(e.message); }
}
window.joinRoom=joinRoom;

function listenRoom(code){
  const {doc, onSnapshot, db, updateDoc} = {doc:window._fb.doc, onSnapshot:window._fb.onSnapshot, db:window._fb.db, updateDoc:window._fb.updateDoc};
  if(unsub) unsub();
  unsub=onSnapshot(doc(db,'quiz_rooms',code), (snap)=>{
    if(!snap.exists()) return;
    const data=snap.data();
    gameState=data;
    if(data.status==='waiting'){
      document.getElementById('setupCard').classList.remove('hidden');
      document.getElementById('feedback')?.textContent && (document.getElementById('feedback').textContent='Waiting for opponent...');
      if(isHost && data.joinId){ // auto start when joined
        updateDoc(doc(db,'quiz_rooms',code), {status:'playing'});
      }
      return;
    }
    if(data.status==='ready' && isHost){
      updateDoc(doc(db,'quiz_rooms',code), {status:'playing'});
      return;
    }
    if(data.status==='playing'){
      // start game UI
      document.getElementById('setupCard').classList.add('hidden');
      document.getElementById('gameCard').classList.remove('hidden');
      document.getElementById('p1NameDisp').textContent=(data.hostName||'HOST').toUpperCase();
      document.getElementById('p2NameDisp').textContent=(data.joinName||'GUEST').toUpperCase();
      renderOnlineQuestion(data);
    }
    if(data.status==='finished'){
      const hostScore=data.scores.host; const joinScore=data.scores.join;
      scores=[hostScore,joinScore];
      document.getElementById('p1Score').textContent=hostScore; document.getElementById('p2Score').textContent=joinScore;
      const winnerName = hostScore>=joinScore? data.hostName : data.joinName;
      document.getElementById('winTitle').textContent=winnerName+' WINS!';
      document.getElementById('winDetails').textContent=`${data.hostName}: ${hostScore} | ${data.joinName}: ${joinScore}`;
      document.getElementById('winPot').textContent='POT: NGN '+Math.floor((data.stake*2)*0.9);
      document.getElementById('winnerOverlay').classList.remove('hidden');
    }
  });
}

let lastRenderedIdx=-1;
function renderOnlineQuestion(data){
  const idx=data.currentIdx;
  if(idx>=10){ return; }
  if(idx!==lastRenderedIdx){
    lastRenderedIdx=idx;
    const q=data.questions[idx];
    document.getElementById('qCount').textContent=`Q ${idx+1}/10`;
    document.getElementById('qCat').textContent=q.cat.toUpperCase();
    document.getElementById('qText').textContent=q.q;
    const optsDiv=document.getElementById('opts');
    optsDiv.innerHTML='';
    q.opts.forEach((o,i)=>{
      const b=document.createElement('button');
      b.className='opt';
      b.textContent=(['A','B','C','D'][i]+'. '+o);
      b.onclick=()=>submitOnlineAnswer(i);
      optsDiv.appendChild(b);
    });
    document.getElementById('p1Score').textContent=data.scores.host;
    document.getElementById('p2Score').textContent=data.scores.join;
    // timer - only host drives advance, but both show timer
    if(isHost){
      startTimerOnline();
    } else {
      // guest just visual timer
      startTimer(()=>{});
    }
    document.getElementById('feedback').textContent='Answer fast! +100 max';
  }
}

function startTimerOnline(){
  timeLeft=15;
  qStartTime=Date.now();
  const fill=document.getElementById('timerFill');
  const txt=document.getElementById('qTimerText');
  fill.style.width='100%';
  clearInterval(timerInt);
  timerInt=setInterval(async ()=>{
    const elapsed=(Date.now()-qStartTime)/1000;
    timeLeft=Math.max(0,15-elapsed);
    txt.textContent=timeLeft.toFixed(1)+'s';
    fill.style.width=(timeLeft/15*100)+'%';
    if(timeLeft<=0){
      clearInterval(timerInt);
      // host advances
      await advanceOnlineQuestion();
    } else {
      // if both answered early, advance
      if(gameState && gameState.answers.host!==null && gameState.answers.join!==null){
        clearInterval(timerInt);
        setTimeout(()=>advanceOnlineQuestion(),800);
      }
    }
  },100);
}

async function submitOnlineAnswer(idx){
  if(!gameState) return;
  const role=isHost?'host':'join';
  if(gameState.answers[role]!==null) return; // already answered
  const q=gameState.questions[gameState.currentIdx];
  const isCorrect=idx===q.a;
  let pts=0;
  if(isCorrect){
    const elapsed=15-timeLeft;
    pts=20+Math.max(0, Math.floor((15-elapsed)* (80/15)));
    if(pts>100) pts=100;
  }
  const {doc, updateDoc, db} = {doc:window._fb.doc, updateDoc:window._fb.updateDoc, db:window._fb.db};
  // update answer and score
  const newScores={...gameState.scores};
  newScores[role]+=pts;
  const newAnswers={...gameState.answers};
  newAnswers[role]=idx;
  try{
    await updateDoc(doc(db,'quiz_rooms',roomCode), {scores:newScores, answers:newAnswers});
    // mark ui
    const opts=document.querySelectorAll('.opt');
    opts.forEach((b,i)=>{
      b.classList.add('disabled');
      if(i===q.a) b.classList.add('correct');
      if(i===idx && idx!==q.a) b.classList.add('wrong');
    });
    document.getElementById('feedback').textContent=isCorrect?`CORRECT +${pts}`:'WRONG! Correct: '+q.opts[q.a];
  }catch(e){ log(e.message); }
}
window.submitOnlineAnswer=submitOnlineAnswer;

async function advanceOnlineQuestion(){
  if(!isHost || !gameState) return;
  const {doc, updateDoc, db} = {doc:window._fb.doc, updateDoc:window._fb.updateDoc, db:window._fb.db};
  let nextIdx=gameState.currentIdx+1;
  if(nextIdx>=10){
    await updateDoc(doc(db,'quiz_rooms',roomCode), {status:'finished'});
  } else {
    await updateDoc(doc(db,'quiz_rooms',roomCode), {currentIdx:nextIdx, answers:{host:null,join:null}});
  }
}

function leaveRoom(){
  if(unsub) unsub();
  roomCode=null;
  isOnline=false; isHost=false; gameState=null;
  setMode('local');
  document.getElementById('roomLabel').classList.add('hidden');
  document.getElementById('roomInfo').classList.add('hidden');
  document.getElementById('gameCard').classList.add('hidden');
  document.getElementById('setupCard').classList.remove('hidden');
  lastRenderedIdx=-1;
  log('Left room');
}
window.leaveRoom=leaveRoom;
</script>
